services:
  postgres:
    image: postgres:16-alpine
    container_name: dratva-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: dratva_workshop
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: dratva_dev_password
    ports:
      - "5432:5432"
    volumes:
      - dratva_pg_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: dratva-web
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      NODE_ENV: production
      PORT: 3000
      SQL_HOST: postgres
      SQL_DB_NAME: dratva_workshop
      SQL_USER: postgres
      SQL_PASSWORD: dratva_dev_password
    ports:
      - "3000:3000"

volumes:
  dratva_pg_data:
